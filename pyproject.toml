[project]
name = "hotkernel"
version = "0.1.0"
description = "Find the hot kernel, cool it down: an Nsight/SASS MCP server with a verify-and-record contract and a kernel-speedrun loop for coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Xinhua Gu" }]
keywords = ["mcp", "cuda", "triton", "nsight", "gpu", "profiling", "kernel", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hotkernel = "hotkernel.server:main"

[project.urls]
Homepage = "https://github.com/xinhuagu/hotkernel"
Issues = "https://github.com/xinhuagu/hotkernel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotkernel"]

[tool.hatch.build.targets.sdist]
include = ["src/hotkernel", "skills", "README.md", "README_zh.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
